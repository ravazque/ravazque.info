name: ravazque-info

# Run through the root Makefile. This file alone is production (make production: https://ravazque.info through the tunnel,
# signs in with FT_UID); with compose.dev.yaml it is make dev, a separate project on https://localhost that signs in with
# the same app. Both can run at once. Every service reads the one root .env.
# No database: sessions and limits live in the api's memory; it writes the consent log and the visitors list to the
# consent volume, and each user's analysed report, encrypted, for a week from its last use, to the reports volume.
services:
  caddy:
    image: caddy:2.11@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    volumes:
      - ./web/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - ./web/certs:/certs:ro
      - caddy_data:/data
    depends_on: [api]
    restart: unless-stopped
  api:
    build: {context: ., dockerfile: Dockerfile}
    env_file:
      - path: .env
        required: false  # make clean / down / logs work before .env exists; make dev-build creates it first
    environment:
      CONSENT_LOG: /data/consent.log
      VISITORS_LOG: /data/visitors.json  # who signed in (Server stats, privacy policy v5)
      CAMPUS_STATS: /data/campus.json  # campus statistics: totals only, weekly (privacy policy v6)
      HOLYGRAPH_FILE: /data/holygraph.json  # the holy graph the owner drew in the editor (none: the built-in one)
      REPORTS_DIR: /reports  # analysed reports, AES-GCM, 7 days from the last use (privacy policy v6)
      BASE_URL: https://ravazque.info
      TUNNEL_TOKEN: ""  # only the tunnel needs it
    volumes: ["consent:/data", "reports:/reports"]
    restart: unless-stopped
  # make production: the named Cloudflare tunnel that serves ravazque.info; its public hostname (ravazque.info ->
  # http://caddy:8080) is set in Cloudflare's dashboard. Only with the profile, so make dev never starts it.
  tunnel:
    image: cloudflare/cloudflared:2026.11.2@sha256:55c7e3e8d89d5e8d20b75a82f3602cbf98e06db406e73e282073cfdc5a9a3af6
    profiles: [tunnel]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [caddy]
    restart: "no"

volumes:
  caddy_data: {}
  consent: {}
  reports: {}
