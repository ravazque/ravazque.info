name: ravazque-info

# Run through the root Makefile. This file alone is production (make production: https://ravazque.info through the tunnel,
# signs in with FT_UID); with compose.dev.yaml it is make dev, a separate project on https://localhost that signs in with
# the same app. Both can run at once. Every service reads the one root .env.
# No database: sessions, report copies and limits live in the api's memory; the only file it writes is the
# consent log in the consent volume.
services:
  caddy:
    image: caddy:2.11@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    volumes:
      - ./web/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - ./web/certs:/certs:ro
      - caddy_data:/data
    depends_on: [api]
    restart: unless-stopped
  api:
    build: {context: ., dockerfile: Dockerfile}
    env_file:
      - path: .env
        required: false  # make clean / down / logs work before .env exists; make dev-build creates it first
    environment:
      CONSENT_LOG: /data/consent.log
      BASE_URL: https://ravazque.info
      TUNNEL_TOKEN: ""  # only the tunnel needs it
    volumes: ["consent:/data"]
    restart: unless-stopped
  # make production: the named Cloudflare tunnel that serves ravazque.info; its public hostname (ravazque.info ->
  # http://caddy:8080) is set in Cloudflare's dashboard. Only with the profile, so make dev never starts it.
  tunnel:
    image: cloudflare/cloudflared:2026.11.1@sha256:e613aadbc2d9511785d2e67a86b0c8ac18dd63a3f9af0d06faf04cbfdcb35f2d
    profiles: [tunnel]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [caddy]
    restart: "no"

volumes:
  caddy_data: {}
  consent: {}
